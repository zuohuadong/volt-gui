# CNB validates the Node 26 + official DSH + Electron source distribution.
# Semver tags publish atomic Windows x64 unsigned-review releases on the Windows runner.

main:
  push:
    - runner:
        namespace: group
        tags:
          - zhd
      stages:
        - name: environment
          script: |
            $ErrorActionPreference = "Stop"
            $nodeVersion = node --version
            if ($nodeVersion -ne "v26.8.1") { throw "Expected Node v26.8.1, got $nodeVersion" }
            $nodeVersion
            git --version
            $pnpmVersion = pnpm.cmd --version
            if ($pnpmVersion -ne "12.1.0") { throw "Expected pnpm 12.1.0, got $pnpmVersion" }
            $pnpmVersion
        - name: install
          script: |
            $ErrorActionPreference = "Stop"
            # OfficeCLI's Node postinstall can hang on the CNB runner proxy.
            # Fetch the pinned Windows binary explicitly with PowerShell so the
            # dependency install remains bounded while the packaged runtime
            # still contains the audited native tool.
            $env:OFFICECLI_SKIP_BINARY_DOWNLOAD = "1"
            pnpm.cmd install --frozen-lockfile
            $officeRoot = Split-Path -Parent (Resolve-Path "node_modules/@officecli/officecli/officecli.js")
            $officeVendor = Join-Path $officeRoot "vendor"
            $officeBinary = Join-Path $officeVendor "officecli.exe"
            New-Item -ItemType Directory -Force -Path $officeVendor | Out-Null
            $officeUrls = @(
              "https://d.officecli.ai/releases/download/v1.0.146/officecli-win-x64.exe",
              "https://github.com/iOfficeAI/OfficeCLI/releases/download/v1.0.146/officecli-win-x64.exe"
            )
            $downloaded = $false
            foreach ($officeUrl in $officeUrls) {
              try {
                Invoke-WebRequest -Uri $officeUrl -OutFile $officeBinary -UseBasicParsing -TimeoutSec 300
                $downloaded = $true
                break
              } catch {
                Remove-Item -LiteralPath $officeBinary -Force -ErrorAction SilentlyContinue
              }
            }
            if (-not $downloaded) { throw "OfficeCLI binary download failed from all mirrors" }
            if (-not (Test-Path $officeBinary)) { throw "OfficeCLI binary was not downloaded" }
            $officeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $officeBinary).Hash
            if ($officeHash -ne "AD36CA99A50102D8F953E8ED1742FAB65C9E201A29733601EA6CA9E676B2EED0") { throw "OfficeCLI binary checksum mismatch" }
        - name: verify
          script: |
            $ErrorActionPreference = "Stop"
            pnpm.cmd run test:dsh-integration
            pnpm.cmd test
            node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/pnpm-invocation.test.mjs scripts/set-electron-package-version.test.mjs scripts/publish-cnb-release.test.mjs scripts/upload-cnb-release-assets.test.mjs
            node scripts/check-migration-boundary.mjs
            pnpm.cmd audit --prod --audit-level high
        - name: build
          script: |
            $ErrorActionPreference = "Stop"
            pnpm.cmd run build
            if (-not (Test-Path "apps/desktop-electron/dist/main.js")) { throw "Electron main bundle not found" }
            if (-not (Test-Path "dist/anyong-dsh/package.json")) { throw "DSH distribution not found" }

$:
  tag_push:
    - runner:
        namespace: group
        tags:
          - zhd
      stages:
        - name: environment
          script: |
            $ErrorActionPreference = "Stop"
            if ($env:CNB_BRANCH -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Unsupported release tag: $env:CNB_BRANCH" }
            $nodeVersion = node --version
            if ($nodeVersion -ne "v26.8.1") { throw "Expected Node v26.8.1, got $nodeVersion" }
            git --version
            $pnpmVersion = pnpm.cmd --version
            if ($pnpmVersion -ne "12.1.0") { throw "Expected pnpm 12.1.0, got $pnpmVersion" }
        - name: install
          script: |
            $ErrorActionPreference = "Stop"
            pnpm.cmd install --frozen-lockfile
        - name: verify
          script: |
            $ErrorActionPreference = "Stop"
            pnpm.cmd run test:dsh-integration
            pnpm.cmd test
            node --test scripts/publish-cnb-release.test.mjs scripts/upload-cnb-release-assets.test.mjs
            node scripts/check-migration-boundary.mjs
        - name: set version
          script: |
            $ErrorActionPreference = "Stop"
            node scripts/set-electron-package-version.mjs "$env:CNB_BRANCH"
        - name: package
          script: |
            $ErrorActionPreference = "Stop"
            $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
            $env:ELECTRON_BUILDER_BINARIES_MIRROR = "https://npmmirror.com/mirrors/electron-builder-binaries/"
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            pnpm.cmd run dist:desktop
            if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed with exit code $LASTEXITCODE" }
            $version = $env:CNB_BRANCH -replace '^desktop-v', '' -replace '^v', ''
            if (-not (Test-Path "dist/anyong-windows-x64-installer-$version.exe")) { throw "Versioned installer not found" }
            if (-not (Test-Path "dist/anyong-windows-x64-portable-$version.zip")) { throw "Versioned portable archive not found" }
            $installer = Get-Item -LiteralPath "dist/anyong-windows-x64-installer-$version.exe"
            $portable = Get-Item -LiteralPath "dist/anyong-windows-x64-portable-$version.zip"
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'NotSigned') { throw "Unexpected signature state for $($installer.Name): $($signature.Status)" }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($portable.FullName)
            try {
              if ($zip.Entries.Count -eq 0) { throw "Portable ZIP is empty" }
              if (-not ($zip.Entries.FullName -contains 'Anyong.exe')) { throw "Portable ZIP missing Anyong.exe" }
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName.EndsWith('/')) { continue }
                $stream = $entry.Open()
                try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
              }
            } finally { $zip.Dispose() }
            Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
            Get-FileHash -Algorithm SHA256 -LiteralPath $portable.FullName
        - name: publish release atomically
          timeout: 60m
          script: |
            $ErrorActionPreference = "Stop"
            $env:CNB_API_ENDPOINT = "https://api.cnb.cool"
            $env:CNB_REPO_SLUG = "aizhuliren/xgic/anyong-agent"
            node scripts/publish-cnb-release.mjs
