# CNB 云原生构建配置 — 西谷智灯暗涌系统 (Anyong DSH + Electron Desktop)
# 参考: https://docs.cnb.cool/zh/build/configuration.md
#
# 架构: 现代 Node.js 22 + pnpm + DSH (DeepSeek Harness) + Electron 桌面端
# 目标: 自动编译测试并构建 Windows (NSIS/便携版)、macOS 与 Linux 桌面安装包

main:
  push:
    # Pipeline 1: 快速编译与全量测试验证（每次 push 执行）
    - docker:
        image: node:22
      env:
        volt_BRAND_NAME: "西谷智灯暗涌系统"
      stages:
        - name: install-deps
          script: |
            corepack enable
            corepack prepare pnpm@10.32.1 --activate
            pnpm install --frozen-lockfile=false

        - name: run-tests
          script: |
            pnpm test

        - name: build-all-packages
          script: |
            pnpm run build
            pnpm --filter @anyong/desktop-electron run build:main

    # Pipeline 2: 自动发版（仅在约定式提交 feat:/fix: 时触发）
    - docker:
        image: node:22
      imports:
        - https://cnb.cool/aizhuliren/volt/anyong-agent/-/blob/main/.cnb/envs.yml
      env:
        GIT_AUTHOR_NAME: "西谷智灯暗涌系统 Bot"
        GIT_AUTHOR_EMAIL: "bot@volt.ai"
        GIT_COMMITTER_NAME: "西谷智灯暗涌系统 Bot"
        GIT_COMMITTER_EMAIL: "bot@volt.ai"
        volt_BRAND_NAME: "西谷智灯暗涌系统"
        DESKTOP_APP_NAME: "Anyong-DSH"
      stages:
        - name: resolve-release-tag
          script: |
            MSG="${CNB_COMMIT_MESSAGE}"

            if echo "$MSG" | grep -q '\[skip-release\]'; then
              echo "[skip-release] detected, skipping"
              touch .release_skip
              exit 0
            fi

            if echo "$MSG" | grep -qE '^(feat|fix)(\(.+\))?!?:'; then
              echo "Conventional commit detected: $MSG"
            else
              echo "Not a release commit (need feat:/fix:), skipping"
              touch .release_skip
              exit 0
            fi

            git fetch --tags origin 2>/dev/null || true
            LATEST_TAG=$(git tag -l --sort=-version:refname | grep -E '^desktop-v[0-9]' | head -1 || true)

            if [ -z "$LATEST_TAG" ]; then
              DESKTOP_TAG="desktop-v0.1.0"
            else
              VERSION_BASE=$(echo "$LATEST_TAG" | sed 's/^desktop-v//')
              MAJOR=$(echo "$VERSION_BASE" | cut -d. -f1)
              MINOR=$(echo "$VERSION_BASE" | cut -d. -f2)
              PATCH=$(echo "$VERSION_BASE" | cut -d. -f3 | cut -d- -f1)

              if echo "$MSG" | grep -qE '^(feat|fix)(\(.+\))?!:'; then
                NEW_MAJOR=$((MAJOR + 1))
                DESKTOP_TAG="desktop-v${NEW_MAJOR}.0.0"
              elif echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then
                NEW_MINOR=$((MINOR + 1))
                DESKTOP_TAG="desktop-v${MAJOR}.${NEW_MINOR}.0"
              else
                NEW_PATCH=$((PATCH + 1))
                DESKTOP_TAG="desktop-v${MAJOR}.${MINOR}.${NEW_PATCH}"
              fi
            fi

            echo "Calculated new version tag: $DESKTOP_TAG"
            VERSION="${DESKTOP_TAG#desktop-v}"

            cat > .release_env <<EOF
            DESKTOP_TAG=$DESKTOP_TAG
            VERSION=$VERSION
            LATEST_TAG=$LATEST_TAG
            EOF

        - name: build-electron-dist
          script: |
            if [ -f .release_skip ]; then
              exit 0
            fi
            . ./.release_env

            corepack enable
            corepack prepare pnpm@10.32.1 --activate
            pnpm install --frozen-lockfile=false

            # 全量编译前端与 DSH 核心
            pnpm run build

            # 调用 electron-builder 构建 Windows (NSIS/便携版) 与 Linux 产物
            cd apps/desktop-electron
            pnpm run build:main
            npx electron-builder --win --x64 --config electron-builder.json
            npx electron-builder --linux --x64 --config electron-builder.json

        - name: generate-checksums
          script: |
            if [ -f .release_skip ]; then
              exit 0
            fi
            . ./.release_env

            cd apps/desktop-electron/dist-package
            sha256sum * > SHA256SUMS.txt
            echo "Artifacts built:"
            ls -la
