# CNB validates the Node 26 + official DSH + Electron source distribution.
# Windows x64 packaging remains on GitHub's Windows runner.

main:
  push:
    - docker:
        image: node:26.8.1
      stages:
        - name: install
          script: |
            corepack enable
            corepack prepare pnpm@11.23.0 --activate
            pnpm install --frozen-lockfile
        - name: verify
          script: |
            pnpm run test:dsh-integration
            pnpm test
            node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/set-electron-package-version.test.mjs
            node scripts/check-migration-boundary.mjs
            pnpm audit --prod --audit-level high
        - name: build
          script: |
            pnpm run build
            test -f apps/desktop-electron/dist/main.js
            test -f dist/anyong-dsh/package.json
