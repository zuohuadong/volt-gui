name: Bug report
description: Report a reproducible VoltUI issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include the exact VoltUI version and platform.
  - type: input
    id: version
    attributes:
      label: Exact version
      description: The version shown by the desktop artifact or package metadata.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / platform
      placeholder: e.g. macOS 15.6 (arm64), Windows 11 (x64)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Electron desktop shell
        - Official DSH Web workflow
        - CLI / Node launcher
        - Documentation site
        - Packaging / CI
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Remove credentials and other sensitive values before posting.
      render: shell
    validations:
      required: false
