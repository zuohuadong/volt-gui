name: Feature request
description: Suggest an improvement to VoltUI or its supported DSH integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Electron desktop shell
        - Official DSH profile or plugin
        - CLI / Node launcher
        - Documentation site
        - Packaging / CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the workflow and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior. Product UI changes should use official DSH extension points when available.
    validations:
      required: false
