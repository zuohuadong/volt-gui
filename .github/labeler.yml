# Area labels for the current Node 26 + Electron + official DSH product.
desktop:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/desktop-electron/**'
          - 'profiles/**'

runtime:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          - 'scripts/anyong.mjs'
          - 'scripts/dsh-integration.test.mjs'
          - 'scripts/smoke-packaged-dsh-runtime*.mjs'

site:
  - changed-files:
      - any-glob-to-any-file:
          - 'site/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.cnb.yml'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
