name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        if: runner.os != 'Windows'
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

      - name: test
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
          # Bound sandbox helper children in Windows tests so a failed OS-level
          # launch cannot pin the Actions step after Go's package timeout fires.
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: go test -p 4 -timeout=3m ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage.
      - name: test -race
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./...

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Electron runtime boundary
        run: |
          node --test scripts/check-electron-runtime-boundary.test.mjs scripts/check-runtime-mocks.test.mjs
          node scripts/check-electron-runtime-boundary.mjs
          node scripts/check-runtime-mocks.mjs

      - name: Check Svelte renderer
        run: pnpm --filter voltui-desktop-workbench run check

      - name: Test DSH and renderer
        run: |
          pnpm run test:dsh-integration
          pnpm test
          pnpm --filter @voltui/desktop-electron run test:config
          pnpm --filter @voltui/desktop-electron run test:profile
          pnpm --filter @voltui/desktop-electron run test:security
          pnpm --filter voltui-desktop-workbench run test:unit

      - name: Build Electron desktop
        run: pnpm run build:desktop

      - name: Package Windows x64 installer and portable executable
        timeout-minutes: 20
        run: pnpm run dist:desktop

      - name: Verify Windows x64 artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath dist -Filter *.exe -File)
          if ($artifacts.Count -lt 2) {
            throw "Electron packaging produced $($artifacts.Count) executable(s); expected NSIS and portable artifacts."
          }
          $artifacts | ForEach-Object { Write-Host $_.Name }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: release workflow contracts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            .github/workflows/release-stable.yml \
            .github/workflows/release.yml \
            .github/workflows/release-npm.yml \
            .github/workflows/release-desktop.yml
          bash scripts/release-workflows.test.sh

  # The site/ auth client has security-sensitive redirect-validation logic
  # (safeNext) covered by node:test unit tests. Those tests use only Node
  # builtins, so no `npm install` is needed — run them directly on every PR so
  # a regression in redirect validation fails the build instead of shipping.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: install
        run: npm ci

      - name: test
        run: npm test

  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true # informational — stdlib vulns need a Go patch release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
