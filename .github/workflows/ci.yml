name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 26 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Verify official DSH and Electron contracts
        run: |
          pnpm run test:dsh-integration
          pnpm test
          node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/set-electron-package-version.test.mjs
      - name: Build distributions
        run: pnpm run build
      - name: Check migration boundary
        run: node scripts/check-migration-boundary.mjs

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
