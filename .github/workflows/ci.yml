name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 26 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Verify official DSH and Electron contracts
        shell: pwsh
        run: |
          pnpm run test:dsh-integration
          if ($LASTEXITCODE -ne 0) { throw "DSH integration tests failed" }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
          node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/pnpm-invocation.test.mjs scripts/set-electron-package-version.test.mjs scripts/native-executable.test.mjs scripts/smoke-packaged-dsh-runtime.test.mjs scripts/smoke-staged-dsh-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Workflow and packaging tests failed" }
      - name: Build distributions
        shell: pwsh
        run: |
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw "Source build failed" }
      - name: Check migration boundary
        shell: pwsh
        run: |
          node scripts/check-migration-boundary.mjs
          if ($LASTEXITCODE -ne 0) { throw "Migration boundary check failed" }
          node scripts/check-skills-sync.mjs
          if ($LASTEXITCODE -ne 0) { throw "Skills sync check failed" }

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
