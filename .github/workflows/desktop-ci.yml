name: Desktop CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/release-desktop.yml"
      - "apps/desktop-electron/**"
      - "apps/desktop-frontend/**"
      - "packages/dsh-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-electron-runtime-boundary*.mjs"
      - "scripts/check-runtime-mocks*.mjs"
      - "scripts/package-dist.mjs"
      - "scripts/package-dist.test.mjs"
      - "scripts/set-electron-package-version.mjs"
      - "scripts/set-electron-package-version.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/release-desktop.yml"
      - "apps/desktop-electron/**"
      - "apps/desktop-frontend/**"
      - "packages/dsh-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-electron-runtime-boundary*.mjs"
      - "scripts/check-runtime-mocks*.mjs"
      - "scripts/package-dist.mjs"
      - "scripts/package-dist.test.mjs"
      - "scripts/set-electron-package-version.mjs"
      - "scripts/set-electron-package-version.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Electron Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime boundaries
        run: |
          node --test scripts/check-electron-runtime-boundary.test.mjs scripts/check-runtime-mocks.test.mjs scripts/package-dist.test.mjs scripts/set-electron-package-version.test.mjs
          node scripts/check-electron-runtime-boundary.mjs
          node scripts/check-runtime-mocks.mjs

      - name: Check Svelte renderer
        run: pnpm --filter voltui-desktop-workbench run check

      - name: Test DSH packages and renderer
        run: |
          pnpm test
          pnpm --filter voltui-desktop-workbench run test:unit

      - name: Build Electron desktop
        run: pnpm run build:desktop

      - name: Package Windows x64
        timeout-minutes: 20
        run: pnpm run dist:desktop

      - name: Verify packaged executables
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath dist -Filter *.exe -File)
          if ($artifacts.Count -lt 2) {
            throw "Electron packaging produced $($artifacts.Count) executable(s); expected NSIS and portable artifacts."
          }
          $artifacts | ForEach-Object { Write-Host $_.Name }

      - name: Upload desktop package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: voltui-electron-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
