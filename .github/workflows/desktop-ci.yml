name: Desktop CI

on:
  pull_request:
    branches: [main]
    paths: &desktop_paths
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/release-desktop.yml"
      - "apps/desktop-electron/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profiles/**"
      - "scripts/anyong.mjs"
      - "scripts/bundle.mjs"
      - "scripts/check-electron-runtime-boundary*.mjs"
      - "scripts/check-migration-boundary.mjs"
      - "scripts/dsh-integration.test.mjs"
      - "scripts/electron-profile.test.mjs"
      - "scripts/package-dist*.mjs"
      - "scripts/set-electron-package-version*.mjs"
      - "scripts/smoke-packaged-dsh-runtime*.mjs"
  push:
    branches: [main]
    paths: *desktop_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Electron Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify runtime and packaging contracts
        run: |
          pnpm run test:dsh-integration
          pnpm test
          node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/set-electron-package-version.test.mjs
          node scripts/check-migration-boundary.mjs
      - run: pnpm run dist:desktop
      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-installer-*.exe" -File)
          $portables = @(Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-portable-*.zip" -File)
          if ($installers.Count -ne 1 -or $portables.Count -ne 1) {
            throw "Expected one NSIS installer and one portable ZIP; found installer=$($installers.Count) portable=$($portables.Count)."
          }
          Write-Host $installers[0].Name
          Write-Host $portables[0].Name
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: anyong-electron-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
