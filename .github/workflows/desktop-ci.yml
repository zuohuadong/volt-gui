name: Desktop CI

on:
  pull_request:
    branches: [main]
    paths: &desktop_paths
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/release-desktop.yml"
      - "apps/desktop-electron/**"
      - "apps/desktop-frontend/**"
      - "plugins/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "profiles/**"
      - "scripts/anyong.mjs"
      - "scripts/bundle.mjs"
      - "scripts/check-electron-runtime-boundary*.mjs"
      - "scripts/check-migration-boundary.mjs"
      - "scripts/ci-workflows.test.mjs"
      - "scripts/dsh-integration.test.mjs"
      - "scripts/desktop-credentials.integration.test.mjs"
      - "scripts/anyong-integrations-mcp*.mjs"
      - "scripts/provision-dsh-profile*.mjs"
      - "scripts/third-party-*.mjs"
      - "scripts/stage-bundled-model-credentials*.mjs"
      - "scripts/electron-profile.test.mjs"
      - "scripts/package-dist*.mjs"
      - "scripts/set-electron-package-version*.mjs"
      - "scripts/native-executable*.mjs"
      - "scripts/pnpm-invocation*.mjs"
      - "scripts/ensure-pnpm.mjs"
      - "scripts/verify-bundled-model-credentials*.mjs"
      - "scripts/smoke-packaged-dsh-runtime*.mjs"
      - "scripts/smoke-staged-dsh-runtime*.mjs"
      - "scripts/check-skills-sync.mjs"
      - "scripts/dsh-upgrade.test.mjs"
      - "scripts/setup-browser-skill.mjs"
  push:
    branches: [main]
    paths: *desktop_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Electron Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify runtime and packaging contracts
        shell: pwsh
        run: |
          pnpm audit --prod --audit-level high
          if ($LASTEXITCODE -ne 0) { throw "Production dependency audit failed" }
          pnpm run test:dsh-integration
          if ($LASTEXITCODE -ne 0) { throw "DSH integration tests failed" }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
          node --test scripts/ci-workflows.test.mjs scripts/package-dist.test.mjs scripts/pnpm-invocation.test.mjs scripts/set-electron-package-version.test.mjs scripts/native-executable.test.mjs scripts/smoke-packaged-dsh-runtime.test.mjs scripts/smoke-staged-dsh-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Workflow and packaging tests failed" }
          node scripts/check-migration-boundary.mjs
          if ($LASTEXITCODE -ne 0) { throw "Migration boundary check failed" }
          node scripts/check-skills-sync.mjs
          if ($LASTEXITCODE -ne 0) { throw "Skills sync check failed" }
      - run: pnpm run dist:desktop
        shell: pwsh
      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-installer-*.exe" -File)
          $portables = @(Get-ChildItem -LiteralPath dist -Filter "*-windows-x64-portable-*.zip" -File)
          if ($installers.Count -ne 1 -or $portables.Count -ne 1) {
            throw "Expected one NSIS installer and one portable ZIP; found installer=$($installers.Count) portable=$($portables.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Unexpected signature state for $($installers[0].Name): $($signature.Status)"
          }
          Write-Host $installers[0].Name
          Write-Host $portables[0].Name
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: anyong-electron-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
