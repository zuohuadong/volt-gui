name: Release desktop artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version (MAJOR.MINOR.PATCH)"
        required: true
        type: string
      ref:
        description: "Immutable branch, tag, or commit to package"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Package unsigned Electron Windows x64
    runs-on: windows-latest
    environment: release
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.1.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify candidate
        shell: pwsh
        run: |
          pnpm audit --prod --audit-level high
          if ($LASTEXITCODE -ne 0) { throw "Production dependency audit failed" }
          pnpm run test:dsh-integration
          if ($LASTEXITCODE -ne 0) { throw "DSH integration tests failed" }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
          node scripts/check-migration-boundary.mjs
          if ($LASTEXITCODE -ne 0) { throw "Migration boundary check failed" }
          node scripts/check-skills-sync.mjs
          if ($LASTEXITCODE -ne 0) { throw "Skills sync check failed" }
      - name: Set package version
        shell: pwsh
        run: |
          node scripts/set-electron-package-version.mjs "$env:DESKTOP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Version staging failed" }
      - name: Require bundled model credential
        shell: pwsh
        env:
          XG_GOMODEL_API_KEY: ${{ secrets.XG_GOMODEL_API_KEY || secrets.XIGU_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XG_GOMODEL_API_KEY)) {
            throw "Missing release secret XG_GOMODEL_API_KEY; refusing to publish a package that cannot authenticate"
          }
      - name: Package Windows x64
        shell: pwsh
        env:
          XG_GOMODEL_API_KEY: ${{ secrets.XG_GOMODEL_API_KEY || secrets.XIGU_API_KEY }}
          XG_GOMODEL_ENDPOINT: ${{ vars.XG_GOMODEL_ENDPOINT || vars.XG_MODEL_BASE_URL || vars.XIGU_MODEL_BASE_URL || 'http://192.168.1.47:9010/v1' }}
          REQUIRE_XG_MODEL_BUNDLE: "1"
        run: |
          pnpm run dist:desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed" }
      - name: Verify bundled model credential is packaged
        shell: pwsh
        run: |
          node scripts/verify-bundled-model-credentials.mjs apps/desktop-electron/dist-package/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw "Packaged model credential verification failed" }
      - name: Confirm artifacts remain unsigned
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath "dist/anyong-windows-x64-installer-$env:DESKTOP_VERSION.exe"
          $portable = Get-Item -LiteralPath "dist/anyong-windows-x64-portable-$env:DESKTOP_VERSION.zip"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Unexpected signature state for $($installer.Name): $($signature.Status)"
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          Get-FileHash -Algorithm SHA256 -LiteralPath $portable.FullName
      - uses: actions/upload-artifact@v7
        with:
          name: anyong-windows-x64-${{ inputs.version }}-unsigned-review
          path: dist/*
          if-no-files-found: error
          retention-days: 14
