<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Electron 工作台无法加载</title>
    <style>
      :root {
        color: #20211f;
        background: #f6f6f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(520px, 100%);
        padding: 24px;
        border: 1px solid #cbcBc6;
        border-radius: 12px;
        background: #fff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: #6f6f69;
        font-size: 13px;
        line-height: 1.6;
      }

      code {
        color: #20211f;
        font-family: "Cascadia Code", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Electron 工作台资源缺失</h1>
      <p>应用没有加载旧 Wails 或 mock 界面。请关闭窗口后运行 <code>pnpm build:desktop</code> 重新生成 Electron 渲染产物。</p>
    </main>
  </body>
</html>
