<?xml version="1.0" encoding="UTF-8"?>
<!--
  Static desktop rendition of the existing Anyong orbital mark.
  Keep the source vector here; appicon.png and windows/icon.ico are derived
  release assets for macOS/Linux and Windows respectively.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="西谷智灯 AI 暗涌平台图标">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf9ff"/>
      <stop offset="55%" stop-color="#c7efff"/>
      <stop offset="100%" stop-color="#93d8f4"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="42%" stop-color="#1b6ca8"/>
      <stop offset="100%" stop-color="#5bc0eb"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="256" ry="256" fill="url(#tile)"/>
  <g transform="translate(512 512) scale(9)">
    <path d="M -35,0 C -35,-22 -12,-35 0,-35 C 12,-35 35,-22 35,0 C 35,22 12,35 0,35 C -12,35 -35,22 -35,0 Z" fill="none" stroke="url(#mark)" stroke-width="4.5" opacity="0.92"/>
    <path d="M -22,0 C -22,-14 -8,-22 0,-22 C 8,-22 22,-14 22,0 C 22,14 8,22 0,22 C -8,22 -22,14 -22,0 Z" fill="none" stroke="url(#mark)" stroke-width="4" opacity="0.96"/>
    <path d="M -10,0 C -10,-7 -4,-10 0,-10 C 4,-10 10,-7 10,0 C 10,7 4,10 0,10 C -4,10 -10,7 -10,0 Z" fill="url(#mark)"/>
    <path d="M -30,6 Q -15,-3 0,6 Q 15,15 30,6" fill="none" stroke="#f8fdff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M -25,-5 Q -12,-14 0,-5 Q 12,4 25,-5" fill="none" stroke="#d8f5ff" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
