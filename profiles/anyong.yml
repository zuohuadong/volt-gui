# Anyong overrides shared by the official DSH web and headless profiles.
# New plugins must be installed as profile bundles through `dsh plugin`;
# an overlay may only override rows supplied by those bundles.

- id: agent-default-model
  config:
    provider: xg-gomodel
    model: vlm

# XG 内置 GOModel 网关。密钥只通过官方 DSH 凭据引用解析，绝不写入此文件。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      xg-gomodel:
        displayName: XG GOModel
        apiKeyEnv: XG_GOMODEL_API_KEY
        api: openai-completions
        baseURL: http://192.168.1.47:9010/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: vlm
            name: VLM (Qwen Text Alias)
            input: [text]
            contextWindow: 65536
            maxTokens: 32768
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            input: [text]
            contextWindow: 1048576
            maxTokens: 32768
          - id: qwen3.8-flash-next
            name: Qwen 3.8 Flash Next
            input: [text]
            contextWindow: 1048576
            maxTokens: 32768

# 默认内置 BrowserSkill Host 插件。官方 Bundle 已提供 browserskill loader，
# 这里只覆盖桌面/CLI 的固定 bsk 路径和懒加载设置，避免重复插入。
- id: browserskill
  config:
    bskPath: !!js "process.env.ANYONG_BSK_PATH ?? process.env.BSK_PATH ?? 'bsk'"
    lazyTools: true

# OfficeCLI 原生提供 MCP stdio server；官方 DSH MCP client 负责工具注册、
# 超时、中止和结果投影，OfficeCLI 仅负责文档处理。
- insert:
    - id: mcp-officecli
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: officecli
        transport: stdio
        command: !!js "process.env.ANYONG_OFFICECLI_COMMAND ?? 'officecli'"
        args: !!js "JSON.parse(process.env.ANYONG_OFFICECLI_ARGS_JSON ?? '[\"mcp\"]')"
        cwd: !!js "process.env.DSH_CWD ?? process.cwd()"
        toolCallTimeoutMs: 120000
        failOnStartupError: true
